name: 功能建议 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题或场景 / Problem or Use Case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed Solution
  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案 / Alternatives Considered
