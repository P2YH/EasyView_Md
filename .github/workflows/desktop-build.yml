name: Desktop Build

# Layer 2: desktop build + Electron e2e on macOS and Windows. Unit tests run in ci.yml (layer 1).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @easyview/desktop
      - run: npm run build:desktop
      - run: npm run test:e2e:desktop
      - name: Show e2e failure context
        if: failure()
        shell: bash
        run: find apps/desktop/test-results -name '*.md' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
      - run: npm run package:desktop
      - run: npm run verify:desktop-package
      - run: npm run verify:desktop-runtime
