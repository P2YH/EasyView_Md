<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: easyview-preview: http: https:; font-src 'self' easyview-preview: data: blob:; connect-src 'self' easyview-preview: http: https: blob:; worker-src 'self' blob:; frame-src 'self' easyview-preview: blob: data: about:; media-src 'self' data: blob: easyview-preview:; object-src 'none'; base-uri 'none';"
    />
    <link href="./webview.css" rel="stylesheet" />
    <link href="./xterm.css" rel="stylesheet" />
    <link href="./preview.css" rel="stylesheet" />
    <link href="./desktop.css" rel="stylesheet" />
    <title>EasyView_Md</title>
  </head>
  <body class="easyview-desktop">
    <div id="desktop-root">
      <header id="desktop-title-bar">
        <div id="desktop-title-left">
        <button id="workspace-toggle" class="desktop-title-button" type="button" title="IndexArea" aria-label="IndexArea">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="15" rx="2.2"></rect>
            <path d="M9 4.5v15"></path>
            <path class="panel-fill" d="M5.7 4.5h3.3v15H5.7c-1.2 0-2.2-1-2.2-2.2V6.7c0-1.2 1-2.2 2.2-2.2Z"></path>
          </svg>
        </button>
        <button id="version-guard-toggle" class="desktop-title-button" type="button" title="Version Guard" aria-label="Version Guard" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M6 7v10M18 8v2a5 5 0 0 1-5 5H6"></path></svg></button>
        </div>
        <div id="desktop-title-center">
          <span id="desktop-document-name">Untitled.md</span>
        </div>
        <div id="desktop-title-actions">
          <button id="ai-chat-toggle" class="desktop-title-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          </button>
        </div>
      </header>
      <div id="desktop-workbench">
        <aside id="workspace-explorer" aria-label="IndexArea"></aside>
        <aside id="version-guard-host" aria-label="Version Guard" hidden></aside>
        <main id="desktop-center-pane">
          <div id="desktop-split-root">
            <section class="desktop-editor-group" data-group-id="group-1">
              <div id="desktop-tab-bar" class="desktop-tab-bar" role="tablist" hidden></div>
              <div id="desktop-main-row" class="desktop-group-content">
                <div id="desktop-active-content" class="desktop-active-content">
                  <div id="desktop-editor-mount" class="desktop-editor-mount" hidden></div>
                  <div id="file-preview-root" class="desktop-preview-root" hidden></div>
                </div>
              </div>
            </section>
          </div>
          <div id="desktop-welcome" hidden></div>
        </main>
        <aside id="desktop-ai-chat-host"></aside>
      </div>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
